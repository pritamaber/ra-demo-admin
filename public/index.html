<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1518">
  <title>RA Jewellers — Store Management</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 4h16l6 8-14 17L2 12z' fill='%23d9b25a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css?v=30">
</head>
<body>
  <div class="app">
    <div class="scrim" id="scrim"></div>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2a1d05" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h12l3 6-9 12L3 9zM3 9h18"/></svg></div>
        <div><div class="brand-name">RA Jewellers</div><div class="brand-sub">Store Management</div></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot"><b>Demo build</b><br>Sample data for evaluation. Reset it any time from Settings.</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <a class="topbar-brand" href="#/dashboard">RA Jewellers</a>
        <div class="search">
          <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-4.5-4.5"/></svg>
          <input id="global-search" type="search" placeholder="Find customer by phone number or name…" autocomplete="off" aria-label="Find customer by phone number">
          <div id="search-results" class="search-results" hidden></div>
        </div>
        <div class="rate-chips" id="rate-chips"></div>
        <a class="btn btn-primary new-order-btn" href="#/orders/new"><span class="plus">+</span><span class="lbl"> New Order</span></a>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Quick navigation"></nav>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script type="module" src="/js/app.js?v=17"></script>
</body>
</html>
